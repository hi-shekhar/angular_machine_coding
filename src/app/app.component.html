<header class="app-header">
  <nav>
    <a routerLink="/" class="logo">{{ title }}</a>
  </nav>
  <nav class="auth-btn">
    @if(!(loginStatus$|async)) {
    <button
      matButton="filled"
      style="background-color: green"
      (click)="handleLogin()"
    >
      Log In
    </button>
    } @if(loginStatus$ | async) {
    <button
      matButton="filled"
      style="background-color: brown"
      (click)="handleLogout()"
    >
      Log out
    </button>
    }
  </nav>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <p>A project by Himanshu Shekhar.</p>
</footer>
